plugins {
    id 'com.android.application'
}

android {
    namespace 'com.appfamilia'
    compileSdk 35

    defaultConfig {
        applicationId 'com.appfamilia'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        buildConfigField 'String', 'SERVIDOR_PADRAO', "\"${project.findProperty('servidorPadrao') ?: 'http://10.0.2.2:8080/'}\""
        buildConfigField 'String', 'GOOGLE_CLIENT_ID', "\"${project.findProperty('googleClientId') ?: ''}\""
    }

    signingConfigs {
        // Chave de depuração fixa no repositório: todo APK gerado tem a mesma assinatura,
        // então uma versão nova instala por cima da anterior sem precisar desinstalar.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

    // Rede
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // Login com Google (Credential Manager)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
