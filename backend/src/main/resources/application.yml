spring:
  application:
    name: app-familia
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appfamilia}
    username: ${DB_USUARIO:appfamilia}
    password: ${DB_SENHA:appfamilia}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o esquema é criado pelo Flyway, o Hibernate só confere

app:
  jwt:
    # Em produção, defina JWT_SEGREDO com um valor aleatório de 32+ caracteres.
    segredo: ${JWT_SEGREDO:troque-este-segredo-de-desenvolvimento-123456}
    validade-horas: 24
  google:
    # "ID do cliente Web" criado no Google Cloud Console. Vazio = login Google desligado.
    client-id: ${GOOGLE_CLIENT_ID:}
  convite:
    validade-dias: 7
  # Modelo de linguagem, em qualquer servidor compatível com a API de chat da OpenAI.
  # Ollama no próprio computador: LLM_URL=http://localhost:11434/v1 (a chave fica vazia).
  llm:
    url: ${LLM_URL:}
    chave: ${LLM_CHAVE:}
    modelo: ${LLM_MODELO:llama3.2}
    modelo-visao: ${LLM_MODELO_VISAO:llama3.2-vision}
  # Instância do SearXNG para as referências do devocional. Vazio = sem pesquisa.
  pesquisa:
    url: ${PESQUISA_URL:}
  # Texto bíblico licenciado pela API.Bible. Vazio = devocional só com a referência.
  biblia:
    url: ${BIBLIA_API_URL:https://rest.api.bible/v1}
    chave: ${BIBLIA_API_CHAVE:}
    versao: ${BIBLIA_API_VERSAO:}
